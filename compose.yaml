name: reprolab

services:
  app:
    build: .
    image: reprolab-dev
    environment:
      # uv run must reject manifest/lock drift rather than rewrite a mounted lock.
      UV_LOCKED: "1"
      PYTHONPATH: /app/src
      # Verification artifacts belong only in scoped /tmp, not the mounted tests.
      PYTEST_ADDOPTS: -p no:cacheprovider
      # Pin numerical-library concurrency as well as the explicit estimator n_jobs.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      # Selective, read-only development mounts; never expose the whole checkout.
      - type: bind
        source: ./pyproject.toml
        target: /app/pyproject.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./uv.lock
        target: /app/uv.lock
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./README.md
        target: /app/README.md
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./src
        target: /app/src
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./tests
        target: /app/tests
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./inputs/Concrete_Data.xls
        target: /app/inputs/Concrete_Data.xls
        read_only: true
        bind:
          create_host_path: false
      # Durable experiment artifacts only; source, tests, and raw XLS stay read-only.
      - type: bind
        source: ./runs
        target: /app/runs
        read_only: false
        bind:
          create_host_path: false
      # Docker-managed storage reserved for a future SQLite checkpointer.
      - type: volume
        source: checkpoint_state
        target: /var/lib/reprolab

volumes:
  checkpoint_state:
